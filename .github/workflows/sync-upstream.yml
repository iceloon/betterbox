name: Sync Bettbox upstream and release Betterbox

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      upstream_branch:
        description: 'Upstream branch to sync (leave empty to use upstream HEAD)'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: true

env:
  UPSTREAM_REPOSITORY: https://github.com/appshubcc/Bettbox.git
  GH_TOKEN: ${{ github.token }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Betterbox
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch upstream Bettbox
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'betterbox-upstream-sync[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream "$UPSTREAM_REPOSITORY"
          branch='${{ inputs.upstream_branch }}'
          if [[ -z "$branch" ]]; then
            branch="$(git ls-remote --symref upstream HEAD | awk '/^ref:/ {sub("refs/heads/", "", $2); print $2; exit}')"
          fi
          [[ -n "$branch" ]] || { echo 'Unable to determine upstream branch.' >&2; exit 1; }
          git fetch --prune upstream "$branch"
          git fetch origin "${{ github.event.repository.default_branch }}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Merge upstream into Betterbox
        id: merge
        shell: bash
        env:
          UPSTREAM_BRANCH: ${{ steps.upstream.outputs.branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git switch --create sync-work "origin/$DEFAULT_BRANCH"
          upstream_ref="upstream/$UPSTREAM_BRANCH"
          if git merge-base --is-ancestor "$upstream_ref" "origin/$DEFAULT_BRANCH"; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Bettbox has no new commits.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! git merge --no-edit --no-ff "$upstream_ref"; then
            conflict_files="$(git diff --name-only --diff-filter=U | sed 's/^/- /')"
            git merge --abort
            title='[upstream-sync] Resolve Bettbox merge conflicts'
            if [[ -z "$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')" ]]; then
              issue_body=$(printf 'The scheduled Betterbox sync could not merge appshubcc/Bettbox:%s into %s.\n\nConflicting files:\n%s\n\nResolve the conflicts locally and push the merge to %s.\n' "$UPSTREAM_BRANCH" "$DEFAULT_BRANCH" "$conflict_files" "$DEFAULT_BRANCH")
              gh issue create --title "$title" --body "$issue_body"
            fi
            exit 1
          fi
          git push origin "HEAD:$DEFAULT_BRANCH"
          upstream_commit="$(git rev-parse "$upstream_ref")"
          version="$(awk '/^version:/ {sub(/^version:[[:space:]]*/, ""); print; exit}' pubspec.yaml)"
          safe_version="${version//+/.}"
          release_tag="v${safe_version}-betterbox.$(date -u +%Y%m%d).${upstream_commit:0:7}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "Merged Bettbox $upstream_commit; release tag: $release_tag" >> "$GITHUB_STEP_SUMMARY"

      - name: Run package build and release
        if: steps.merge.outputs.changed == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ steps.merge.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh workflow run build.yaml --ref "$DEFAULT_BRANCH" -f platform=all -f release_tag="$RELEASE_TAG" -f create_release=true
          echo "Dispatched build workflow for $RELEASE_TAG." >> "$GITHUB_STEP_SUMMARY"
