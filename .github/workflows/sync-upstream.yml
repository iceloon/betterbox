name: Sync Bettbox upstream

on:
  schedule:
    # Check the upstream repository once a day. A manual dispatch is also
    # available when an upstream release needs to be pulled immediately.
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      upstream_branch:
        description: 'Upstream branch to sync (leave empty to use upstream HEAD)'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: true

env:
  UPSTREAM_REPOSITORY: https://github.com/appshubcc/Bettbox.git
  SYNC_BRANCH: automation/upstream-bettbox-sync
  GH_TOKEN: ${{ github.token }}

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Betterbox
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch upstream Bettbox
        id: upstream
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'betterbox-upstream-sync[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream "$UPSTREAM_REPOSITORY"

          branch='${{ inputs.upstream_branch }}'
          if [[ -z "$branch" ]]; then
            branch="$(git ls-remote --symref upstream HEAD \
              | awk '/^ref:/ {sub("refs/heads/", "", $2); print $2; exit}')"
          fi
          if [[ -z "$branch" ]]; then
            echo 'Unable to determine the upstream default branch.' >&2
            exit 1
          fi

          git fetch --prune upstream "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "Upstream branch: $branch" >> "$GITHUB_STEP_SUMMARY"

      - name: Merge upstream without overwriting Betterbox changes
        id: merge
        shell: bash
        env:
          UPSTREAM_BRANCH: ${{ steps.upstream.outputs.branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          git fetch origin "$DEFAULT_BRANCH"
          git switch --create "$SYNC_BRANCH" "origin/$DEFAULT_BRANCH"

          if git merge --no-edit --no-ff "upstream/$UPSTREAM_BRANCH"; then
            echo 'merged=true' >> "$GITHUB_OUTPUT"
            echo 'Upstream changes merged successfully.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          conflict_files="$(git diff --name-only --diff-filter=U | sed 's/^/- /')"
          git merge --abort
          echo 'merged=false' >> "$GITHUB_OUTPUT"
          {
            echo '### Upstream sync needs manual conflict resolution'
            echo
            echo "The automatic merge from appshubcc/Bettbox:$UPSTREAM_BRANCH into $DEFAULT_BRANCH could not be completed."
            echo
            echo 'Conflicting files:'
            echo "$conflict_files"
            echo
            echo 'Resolve the conflicts locally, push the resolved merge to `main`, and close this issue.'
          } >> "$GITHUB_STEP_SUMMARY"

          title='[upstream-sync] Resolve Bettbox merge conflicts'
          issue_number="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [[ -z "$issue_number" ]]; then
            issue_body=$(printf 'The scheduled Betterbox sync could not merge appshubcc/Bettbox:%s into %s.\n\nConflicting files:\n%s\n\nResolve the conflicts locally and push the merge to %s.\n' \
              "$UPSTREAM_BRANCH" "$DEFAULT_BRANCH" "$conflict_files" "$DEFAULT_BRANCH")
            gh issue create --title "$title" --body "$issue_body"
          fi
          exit 1

      - name: Open or update upstream sync pull request
        if: steps.merge.outputs.merged == 'true'
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          UPSTREAM_BRANCH: ${{ steps.upstream.outputs.branch }}
        run: |
          set -euo pipefail

          if git diff --quiet "origin/$DEFAULT_BRANCH" HEAD; then
            echo 'Betterbox is already up to date.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git push --force-with-lease origin "HEAD:$SYNC_BRANCH"
          pr_url="$(gh pr list \
            --state open \
            --head "$SYNC_BRANCH" \
            --base "$DEFAULT_BRANCH" \
            --json url \
            --jq '.[0].url // empty')"

          if [[ -z "$pr_url" ]]; then
            pr_body=$(printf 'This PR merges the latest appshubcc/Bettbox:%s into Betterbox.\n\nThe Betterbox-only rule management feature remains in this repository and should be reviewed for conflicts before merging.\n' \
              "$UPSTREAM_BRANCH")
            gh pr create \
              --base "$DEFAULT_BRANCH" \
              --head "$SYNC_BRANCH" \
              --title "chore: sync Bettbox $UPSTREAM_BRANCH" \
              --body "$pr_body"
          else
            echo "Updated existing pull request: $pr_url" >> "$GITHUB_STEP_SUMMARY"
          fi
